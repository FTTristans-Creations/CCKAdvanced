name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (X.Y.Z). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CCK lives in Assets/ like the official CCK so scripts compile into
      # Assembly-CSharp/Assembly-CSharp-Editor exactly like a .unitypackage install.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import json; print(json.load(open('Packages/com.fttristan.cck-advanced/package.json'))['version'])")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not plain semver (expected X.Y.Z)."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Stamp the resolved version into both places the updater reads it.
      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          PKG_DIR="Packages/com.fttristan.cck-advanced"
          python3 - "$VERSION" "$PKG_DIR/package.json" <<'PY'
          import json, sys
          version, path = sys.argv[1], sys.argv[2]
          with open(path) as f:
              data = json.load(f)
          data['version'] = version
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          sed -i "s/public const string Version = \"[^\"]*\";/public const string Version = \"$VERSION\";/" \
            "Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"
          grep -q "Version = \"$VERSION\"" \
            "Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"

          # Version marker the installer reads to decide install vs update.
          echo "$VERSION" > Assets/CVR.CCK/CCKAdvanced.version

          # The installer package tracks the same release version.
          python3 - "$VERSION" "installer/com.fttristan.cck-advanced.installer/package.json" <<'PY'
          import json, sys
          version, path = sys.argv[1], sys.argv[2]
          with open(path) as f:
              data = json.load(f)
          data['version'] = version
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          echo "Stamped version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Source snapshot of the Assets tree with metas. package.json is kept
      # under package-info/ rather than the zip root so the VPM listing
      # generator (which keys on a root package.json) does not re-list
      # com.fttristan.cck-advanced as an installable package — distribution
      # goes through the installer instead.
      - name: Create Source Zip
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ZIP_NAME="cck-advanced-source-$VERSION.zip"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/package-info"
          cp Packages/com.fttristan.cck-advanced/package.json* "$STAGE/package-info/"
          mkdir -p "$STAGE/Assets"
          cp -r Assets/CVR.CCK "$STAGE/Assets/"
          cp Assets/CVR.CCK.meta "$STAGE/Assets/"
          cp Assets/csc.rsp* "$STAGE/Assets/" 2>/dev/null || true
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x "*.DS_Store" "*/.DS_Store" "*.tmp" "*.backup" "*.backup.meta")
          rm -rf "$STAGE"
          echo "Built $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Payload the installer downloads: Assets/CVR.CCK + csc.rsp + a manifest
      # of every installed path so updates can delete what upstream removed.
      - name: Create Payload Zip
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ZIP_NAME="cck-advanced-payload-$VERSION.zip"
          STAGE="$(mktemp -d)/payload"
          mkdir -p "$STAGE/Assets"
          cp -r Assets/CVR.CCK "$STAGE/Assets/"
          cp Assets/CVR.CCK.meta "$STAGE/Assets/"
          cp Assets/csc.rsp* "$STAGE/Assets/" 2>/dev/null || true
          (cd "$STAGE/Assets" && find . -type f | sed 's|^\./|Assets/|' | LC_ALL=C sort) \
            > "$STAGE/install-manifest.txt"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x "*.DS_Store" "*/.DS_Store" "*.tmp" "*.backup" "*.backup.meta")
          echo "Built $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Installer distribution: VPM-style zip (package.json + Assets) for VCC,
      # and a .unitypackage wrapping the same Editor scripts.
      - name: Create Installer Zip
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ZIP_NAME="com.fttristan.cck-advanced-installer-$VERSION.zip"
          STAGE="$(mktemp -d)"
          cp -r installer/com.fttristan.cck-advanced.installer/. "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x "*.DS_Store" "*/.DS_Store" "*.tmp" "*.backup" "*.backup.meta")
          rm -rf "$STAGE"
          echo "Built $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # .unitypackage needs Assets/-rooted paths. The CCK already lives at
      # Assets/CVR.CCK in this repo, so only the meta list needs building.
      # Assets/csc.rsp ships too: its defines must exist on a consumer's very
      # first compile, before CCK_EnvConfig can add them to ProjectSettings.
      - name: Track Package Meta Files
        run: |
          find "Assets/CVR.CCK" -name "*.meta" > metaList
          [ -f Assets/csc.rsp.meta ] && echo "Assets/csc.rsp.meta" >> metaList
          # The installer ships as a second unitypackage; stage its Editor
          # scripts under Assets/ so they get Assets/-rooted meta paths, and
          # remove them again after both packages are built.
          cp -r installer/com.fttristan.cck-advanced.installer/Assets/CCKInstaller Assets/
          cp installer/com.fttristan.cck-advanced.installer/Assets/CCKInstaller.meta Assets/
          find "Assets/CCKInstaller" -name "*.meta" > installerMetaList
          echo "Assets/CCKInstaller.meta" >> installerMetaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          package-path: com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
          include-files: metaList

      - name: Create Installer UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          package-path: com.fttristan.cck-advanced-installer-${{ steps.version.outputs.value }}.unitypackage
          include-files: installerMetaList

      - name: Clean installer staging
        run: rm -rf Assets/CCKInstaller Assets/CCKInstaller.meta

      # Tag is the bare version, matching the official template convention.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: CCK Advanced ${{ steps.version.outputs.value }}
          files: |
            cck-advanced-source-${{ steps.version.outputs.value }}.zip
            cck-advanced-payload-${{ steps.version.outputs.value }}.zip
            com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
            com.fttristan.cck-advanced-installer-${{ steps.version.outputs.value }}.zip
            com.fttristan.cck-advanced-installer-${{ steps.version.outputs.value }}.unitypackage
            Packages/com.fttristan.cck-advanced/package.json
          generate_release_notes: true
          overwrite_files: true
