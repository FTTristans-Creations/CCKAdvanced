name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (X.Y.Z). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package lives in the repo as an embedded UPM package so the dev
      # project compiles it exactly like an end-user install.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import json; print(json.load(open('Packages/com.fttristan.cck-advanced/package.json'))['version'])")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not plain semver (expected X.Y.Z)."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Stamp the resolved version into both places the updater reads it.
      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          PKG_DIR="Packages/com.fttristan.cck-advanced"
          python3 - "$VERSION" "$PKG_DIR/package.json" <<'PY'
          import json, sys
          version, path = sys.argv[1], sys.argv[2]
          with open(path) as f:
              data = json.load(f)
          data['version'] = version
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          sed -i "s/public const string Version = \"[^\"]*\";/public const string Version = \"$VERSION\";/" \
            "$PKG_DIR/Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"
          grep -q "Version = \"$VERSION\"" \
            "$PKG_DIR/Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"
          echo "Stamped version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # VPM package: package.json at zip root + the Assets tree with metas.
      - name: Create Package Zip
        run: |
          set -euo pipefail
          ZIP_NAME="com.fttristan.cck-advanced.zip"
          rm -f "$ZIP_NAME"
          (cd Packages/com.fttristan.cck-advanced && \
            zip -r "../../$ZIP_NAME" package.json package.json.meta Assets.meta Assets \
            -x "*.DS_Store" "*/.DS_Store" "*.tmp" "*.backup" "*.backup.meta")
          echo "Built $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # .unitypackage needs Assets/-rooted paths, so stage the package content
      # under Assets/ in the (otherwise empty) checkout before listing metas.
      - name: Stage Assets tree for unitypackage
        run: |
          set -euo pipefail
          mkdir -p Assets
          cp -r "Packages/com.fttristan.cck-advanced/Assets/CVR.CCK" Assets/
          cp "Packages/com.fttristan.cck-advanced/Assets/CVR.CCK.meta" Assets/
          cp -r "Packages/com.fttristan.cck-advanced/Assets/CompatStubs" Assets/

      - name: Track Package Meta Files
        run: find "Assets/CVR.CCK" "Assets/CompatStubs" -name "*.meta" > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          package-path: com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
          include-files: metaList

      # Tag is the bare version, matching the official template convention.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: CCK Advanced ${{ steps.version.outputs.value }}
          files: |
            com.fttristan.cck-advanced.zip
            com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
            Packages/com.fttristan.cck-advanced/package.json
          generate_release_notes: true
          overwrite_files: true
