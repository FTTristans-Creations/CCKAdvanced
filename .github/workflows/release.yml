name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (X.Y.Z). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json like the official template; the input
      # only overrides it for one-off builds.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not plain semver (expected X.Y.Z)."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Stamp the resolved version into both places the updater reads it.
      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          with open('package.json') as f:
              data = json.load(f)
          data['version'] = version
          with open('package.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          sed -i "s/public const string Version = \"[^\"]*\";/public const string Version = \"$VERSION\";/" \
            "Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"
          grep -q "Version = \"$VERSION\"" \
            "Assets/CVR.CCK/Advanced/Scripts/Common/CCKAdvancedInfo.cs"
          echo "Stamped version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # VPM package: package.json at zip root + the Assets tree with metas.
      - name: Create Package Zip
        run: |
          set -euo pipefail
          ZIP_NAME="com.fttristan.cck-advanced.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" package.json "Assets/CVR.CCK" \
            -x "*.DS_Store" "*/.DS_Store" "*.tmp"
          echo "Built $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Legacy .unitypackage built from the .meta list, same as the template.
      - name: Track Package Meta Files
        run: find "Assets/CVR.CCK" -name "*.meta" > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          package-path: com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
          include-files: metaList

      # Tag is the bare version, matching the official template convention.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: CCK Advanced ${{ steps.version.outputs.value }}
          files: |
            com.fttristan.cck-advanced.zip
            com.fttristan.cck-advanced-${{ steps.version.outputs.value }}.unitypackage
            package.json
          generate_release_notes: true
          overwrite_files: true
